[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-translator-realtime"
version = "0.1.0"
description = "Realtime audio translation overlay for Windows"
requires-python = ">=3.11"
dependencies = [
    "pycaw",
    "psutil",
    "comtypes",
    "numpy",
    "soxr",
    "proc-tap>=1.1.1,<1.2",
    "onnxruntime",
    "kaldi-native-fbank>=1.20",
    "faster-whisper>=1.2.1,<1.3",
    "ctranslate2>=4.5,<5",
    "sentencepiece",
    "transformers>=4.40",
    "huggingface_hub",
    "piper-tts>=1.3,<2",
    "sounddevice",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "websockets",
    "PySide6>=6.12.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-qt", "httpx", "nbformat"]
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]
convert = ["torch", "transformers"]  # only for ct2-transformers-converter (CPU torch: --index-url https://download.pytorch.org/whl/cpu)
training = ["pyarrow"]  # local dry-runs of the Colab notebooks' data readers

[tool.setuptools.packages.find]
include = ["backend*", "ui*"]

[tool.pytest.ini_options]
markers = ["gpu: needs GPU/model", "manual: manual test"]
addopts = '-m "not gpu and not manual"'
testpaths = ["tests", "training/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
